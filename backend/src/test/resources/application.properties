app.version=0.1.0
spring.datasource.url=jdbc:h2:mem:system_design_copilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.security.clerk.issuer=https://clerk.test
app.security.clerk.audience=system-design-copilot-api
app.security.clerk.authorized-party=http://localhost:3000
app.security.clerk.jwk-set-uri=https://clerk.test/.well-known/jwks.json
app.security.cors.allowed-origins=http://localhost:3000
app.entitlements.free.active-workspaces=10
app.entitlements.free.copilot-turns-per-month=50
app.entitlements.free.reviews-per-month=5
app.billing.stripe-secret-key=sk_test_placeholder
app.billing.stripe-webhook-secret=whsec_test_webhook_secret
app.billing.pro-price-id=price_test_pro
app.billing.synthetic-clerk-subject=synthetic_test_user
app.billing.test-pro-enabled=true
app.billing.checkout-success-url=http://localhost:3000/billing/success?session_id={CHECKOUT_SESSION_ID}
app.billing.checkout-cancel-url=http://localhost:3000/billing/cancel
app.billing.portal-return-url=http://localhost:3000/billing
app.billing.checkout-cooldown-seconds=60
app.billing.past-due-grace-days=7
app.billing.webhook-tolerance-seconds=300
