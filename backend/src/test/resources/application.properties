app.version=0.1.0
spring.datasource.url=jdbc:h2:mem:system_design_copilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.security.clerk.issuer=https://clerk.test
app.security.clerk.audience=system-design-copilot-api
app.security.clerk.authorized-party=http://localhost:3000
app.security.clerk.jwk-set-uri=https://clerk.test/.well-known/jwks.json
app.security.cors.allowed-origins=http://localhost:3000
app.entitlements.free.active-workspaces=10
app.entitlements.free.copilot-turns-per-month=50
app.entitlements.free.reviews-per-month=5
