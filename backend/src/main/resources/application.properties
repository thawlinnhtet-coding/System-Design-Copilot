spring.config.import=optional:file:.env[.properties]
spring.application.name=system-design-copilot
app.version=0.1.0
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.security.clerk.issuer=${CLERK_JWT_ISSUER}
app.security.clerk.audience=${CLERK_JWT_AUDIENCE}
app.security.clerk.authorized-party=${CLERK_AUTHORIZED_PARTY}
app.security.clerk.jwk-set-uri=${CLERK_JWK_SET_URI}
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.entitlements.free.active-workspaces=${FREE_ACTIVE_WORKSPACE_LIMIT:10}
app.entitlements.free.copilot-turns-per-month=${FREE_COPILOT_TURNS_PER_MONTH:50}
app.entitlements.free.reviews-per-month=${FREE_REVIEWS_PER_MONTH:5}
app.billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.pro-price-id=${STRIPE_PRO_PRICE_ID:}
app.billing.synthetic-clerk-subject=${STRIPE_SYNTHETIC_CLERK_SUBJECT:}
app.billing.test-pro-enabled=${STRIPE_TEST_PRO_ENABLED:false}
app.billing.checkout-success-url=${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:3000/billing/success?session_id={CHECKOUT_SESSION_ID}}
app.billing.checkout-cancel-url=${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:3000/billing/cancel}
app.billing.portal-return-url=${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/account}
app.billing.checkout-cooldown-seconds=${STRIPE_CHECKOUT_COOLDOWN_SECONDS:60}
app.billing.past-due-grace-days=${STRIPE_PAST_DUE_GRACE_DAYS:7}
app.billing.webhook-tolerance-seconds=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
