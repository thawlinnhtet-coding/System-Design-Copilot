services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-system_design_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-system_design_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-database-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
